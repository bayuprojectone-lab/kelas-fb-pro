<!DOCTYPE html>
<html lang="id">
 <style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikat - FB Pro Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo">
                    <i class="fa-brands fa-facebook"></i>
                    <span>FB Pro Academy</span>
                </a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div class="sidebar-profile">
                <div class="sidebar-profile-avatar" id="sidebarAvatar"></div>
                <h4 id="sidebarName">Nama Pengguna</h4>
                <span id="sidebarUsername">@username</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="profile.html"><i class="fa-solid fa-user"></i> Profil Saya</a>
                <a href="course.html"><i class="fa-solid fa-book"></i> Materi Kursus</a>
                <a href="course.html"><i class="fa-solid fa-video"></i> Video Pembembelajaran</a>
                <a href="dashboard.html"><i class="a-solid fa-chart-line"></i> Progress Belajar</a>
                <a href="certificate.html" class="active"><i class="fa-solid fa-trophy"></i> Sertifikat</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Pengaturan</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1>Sertifikat</h1>
                </div>
                <div class="header-right">
                    <div class="header-notif">
                        <i class="fa-solid fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <a href="profile.html" class="header-profile">
                        <div class="header-avatar" id="headerAvatar"></div>
                        <span id="headerName">Nama</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </div>
            </header>

            <div class="certificate-page-content">
                <div class="certificate-container" id="certificateContainer">
                    <!-- Certificate content will be rendered by JS -->
                </div>
            </div>
        </main>
        
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/course.js"></script>
    <script>
        // Toggle sidebar
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
        });
        document.getElementById('sidebarClose').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });
        
        // Render certificate
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('fbProUser')) || { name: 'Peserta' };
            const profileData = JSON.parse(localStorage.getItem('fbProProfile')) || {};
            const courseData = JSON.parse(localStorage.getItem('fbProCourse')) || { completedModules: [] };
            
            const name = profileData.name || userData.name;
            const avatar = profileData.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1877F2&color=fff&size=128`;
            
            document.getElementById('headerAvatar').style.backgroundImage = `url(${avatar})`;
            document.getElementById('sidebarAvatar').style.backgroundImage = `url(${avatar})`;
            document.getElementById('headerName').textContent = name;
            document.getElementById('sidebarName').textContent = name;
            document.getElementById('sidebarUsername').textContent = profileData.username || '@username';
            
            const completedCount = courseData.completedModules ? courseData.completedModules.length : 0;
            const totalModules = 16;
            const progressPercent = Math.round((completedCount / totalModules) * 100);
            
            const certificateContainer = document.getElementById('certificateContainer');
            
            if (progressPercent === 100) {
                const certId = 'FBC-' + Date.now().toString().slice(-8);
                const date = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                
                certificateContainer.innerHTML = `
                    <div class="certificate">
                        <div class="certificate-border">
                            <div class="certificate-content">
                                <div class="certificate-header">
                                    <div class="cert-logo">
                                        <i class="fa-brands fa-facebook"></i>
                                        <span>FB Pro Academy</span>
                                    </div>
                                    <div class="cert-badge">
                                        <i class="fa-solid fa-award"></i>
                                    </div>
                                </div>
                                <div class="certificate-body">
                                    <h1>SERTIFIKAT PENYELESAIAN</h1>
                                    <p class="cert-subtitle">Diberikan kepada</p>
                                    <h2 class="cert-name">${name}</h2>
                                    <p class="cert-desc">Telah menyelesaikan Kursus Facebook Pro dengan baik dan tuntas. Memenuhi semua persyaratan dan kompetensi yang dibutuhkan untuk menjadi Facebook Pro.</p>
                                </div>
                                <div class="certificate-footer">
                                    <div class="cert-info">
                                        <strong>${certId}</strong>
                                        <span>Nomor Sertifikat</span>
                                    </div>
                                    <div class="cert-signature">
                                        <i class="fa-solid fa-signature"></i>
                                        <strong>FB Pro Academy</strong>
                                        <span>${date}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="certificate-actions">
                        <button class="btn btn-primary" onclick="window.print()">
                            <i class="fa-solid fa-download"></i> Download Sertifikat
                        </button>
                    </div>
                `;
            } else {
                certificateContainer.innerHTML = `
                    <div class="certificate-locked">
                        <div class="locked-icon">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h2>Sertifikat Belum Tersedia</h2>
                        <p>Selesaikan semua modul kursus untuk membuka sertifikat penyelesaian.</p>
                        <div class="locked-progress">
                            <div class="progress-info">
                                <span>${completedCount} / ${totalModules} Modul Selesai</span>
                                <span>${progressPercent}%</span>
                            </div>
                            <div class="progress-bar large">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                        <a href="course.html" class="btn btn-primary">Lanjutkan Belajar</a>
                    </div>
                `;
            }
        });
    </ </>
</body>
</html>
