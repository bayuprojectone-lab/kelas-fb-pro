<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Kursus - FB Pro Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Copy sidebar from dashboard.html -->
            <div class="sidebar-header">
                <a href="dashboard.html" class="button">
                    <i class="fa-brands fa-facebook"></i>
                    <span>FB Pro Academy</span>
                </a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div class="sidebar-profile">
                <div class="sidebar-profile-avatar" id="sidebarAvatar"></div>
                <h4 id="sidebarName">Nama Pengguna</h4>
                <span id="sidebarUsername">@username</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="profile.html"><i class="fa-solid fa-user"></i> Profil Saya</a>
                <a href="course.html" class="active"><i class="fa-solid fa-book"></i> Materi Kursus</a>
                <a href="course.html"><i class="fa-solid fa-video"></i> Video Pembelajaran</a>
                <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Progress Belajar</a>
                <a href="certificate.html"><i class="fa-solid fa-trophy"></i> Sertifikat</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Pengaturan</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
            </nav>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <button class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <h1>Materi Kursus</h1>
                </div>
                <div class="header-right">
                    <div class="header-notif">
                        <i class="fa-solid fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <a href="profile.html" class="header-profile">
                        <div class="header-avatar" id="headerAvatar"></style></div>
                        <span id="headerName">Nama</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </a>
                </div>
            </header>

            <div class="course-page-content">
                <div class="course-header">
                    <div>
                        <h2>FACEBOOK PRO PEMULA</h2>
                        <div class="course-meta">
                            <span class="badge badge-blue">Level: Pemula</span>
                            <span class="badge badge-green">Durasi: 30 Hari</span>
                            <span class="badge badge-orange">Materi: 16 Modul</span>
                            <span class="badge badge-purple">Akses: Lifetime</span>
                        </div>
                    </div>
                    <div class="course-progress-overview">
                        <div class="progress-info">
                            <span id="courseProgressText">0% Selesai</span>
                        </div>
                        <div class="progress-bar large">
                            <div class="progress-fill" id="courseProgressBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="modules-list" id="modulesList">
                    <!-- Modules will be rendered by JavaScript -->
                </div>
            </div>
        </main>
        
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/course.js"></script>
    <script>
        // Toggle sidebar
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
        });
        document.getElementById('sidebarClose').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });
        document.getElementById('sidebarOverlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        });
    </script>
</body>
</html>
